<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Study Groups</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h3>List Groups</h3>
    <hr>

    <a th:href="@{/addGroupForm}" class="btn btn-primary">
        Add Group
    </a>

    <table class="table table-bordered table-striped mt-3">
        <thead>
        <tr>
            <th>Название</th>
            <th>Факультет</th>
            <th>Курс</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="group : ${groups}">
            <td th:text="${group.name}"></td>
            <td th:text="${group.faculty}"></td>
            <td th:text="${group.course}"></td>

            <td>
                <a th:href="@{/showGroupUpdateForm(groupId=${group.id})}" class="btn btn-info">
                    Изменить
                </a>

                <a th:href="@{/deleteGroup(groupId=${group.id})}" class="btn btn-danger">
                    Удалить
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
