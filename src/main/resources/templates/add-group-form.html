<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Study Group</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h3>Study Group</h3>
    <hr>

    <form th:action="@{/saveGroup}" th:object="${group}" method="POST">

        <input type="text" th:field="*{name}" class="form-control mb-3" placeholder="Название группы">

        <input type="text" th:field="*{faculty}" class="form-control mb-3" placeholder="Факультет">

        <input type="number" th:field="*{course}" class="form-control mb-3" placeholder="Курс">

        <input type="hidden" th:field="*{id}">

        <button type="submit" class="btn btn-primary">
            Save
        </button>
    </form>

    <hr>
    <a th:href="@{/groups}">Back to list</a>

</div>
</body>
</html>
